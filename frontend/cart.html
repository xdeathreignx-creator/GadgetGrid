
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | GadgetGrid</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cart.css">
</head>
<body>

    <header class="header">
        <nav class="navbar">
            <a href="index.html" class="logo">Gadget<span>Grid</span></a>

            <button class="menu-toggle" id="menuToggle">☰</button>

            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="cart.html">Cart (<span id="cartCount">0</span>)</a></li>
            </ul>
        </nav>
    </header>

    <main class="cart-page">
        <div class="cart-heading">
            <h1>Your Shopping Cart</h1>
            <p>Review your products before checkout.</p>
        </div>

        <div class="cart-layout">
            <section>
                <div class="cart-items" id="cartItems"></div>
            </section>

            <aside class="cart-summary">
                <h2>Order Summary</h2>

                <div class="summary-row">
                    <span>Subtotal</span>
                    <strong id="subtotal">৳0</strong>
                </div>

                <div class="summary-total">
                    <span>Total</span>
                    <strong id="total">৳0</strong>
                </div>

                <a href="checkout.html" class="checkout-btn" id="checkoutBtn">
                    Proceed to Checkout
                </a>

                <a href="products.html" class="continue-shopping">
                    Continue Shopping
                </a>
            </aside>
        </div>
    </main>

    <script src="js/cart.js"></script>
</body>
</html>

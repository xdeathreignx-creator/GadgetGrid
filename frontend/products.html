
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products | GadgetGrid</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/products.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">
            Gadget<span>Grid</span>
        </a>

        <button class="menu-toggle" id="menuToggle"
            aria-label="Toggle navigation" aria-expanded="false">
            ☰
        </button>

        <nav class="nav-links" id="navLinks">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="products.html">Categories</a>
            <a href="contact.html">Contact</a>
            <a href="cart.html" class="cart-link">
                Cart (<span id="cartCount">0</span>)
            </a>
        </nav>
    </header>

    <main>

        <section class="catalog-hero">
            <span>GADGETGRID COLLECTION</span>
            <h1>Explore Our Products</h1>
            <p>Discover technology that makes everyday life better.</p>
        </section>

        <section class="catalog-section">

            <div class="catalog-heading">
                <div>
                    <h2>All Products</h2>
                    <p id="productCount">Loading products...</p>
                </div>

                <select id="sortProducts">
                    <option value="default">Default sorting</option>
                    <option value="low">Price: Low to High</option>
                    <option value="high">Price: High to Low</option>
                    <option value="name">Name: A to Z</option>
                </select>
            </div>

            <div class="catalog-controls">

                <input
                    type="search"
                    id="searchProducts"
                    placeholder="Search gadgets..."
                    aria-label="Search products"
                >

                <select id="categoryFilter">
                    <option value="all">All Categories</option>
                    <option value="Smartphones">Smartphones</option>
                    <option value="Headphones & Earbuds">Headphones & Earbuds</option>
                    <option value="Smartwatches">Smartwatches</option>
                    <option value="Speakers">Speakers</option>
                    <option value="Gaming Accessories">Gaming Accessories</option>
                    <option value="Computer Accessories">Computer Accessories</option>
                    <option value="Chargers & Power Banks">Chargers & Power Banks</option>
                    <option value="Other Gadgets">Other Gadgets</option>
                </select>

            </div>

            <div class="product-grid" id="productGrid">
                <!-- Products generated by JavaScript -->
            </div>

            <p id="emptyMessage" class="empty-message" hidden>
                No products found. Try another search.
            </p>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 GadgetGrid. All rights reserved.</p>
    </footer>

    <script src="js/products.js"></script>

</body>
</html>
